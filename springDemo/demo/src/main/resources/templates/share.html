<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav class="navbar navbar-expand-lg navbar-dark bg-info mb-4" th:fragment="header">
	<div class="container-fluid">
		<a class="navbar-brand" href="/index">読書管理アプリ</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
			aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarNavAltMarkup">
			<div class="navbar-nav">
				<a class="nav-link" aria-current="page" th:href="@{/index}">Home</a>
				<a class="nav-link" th:href="@{/booklist}">書籍一覧</a>

				<div sec:authorize="isAuthenticated()">
					<a class="nav-link" aria-current="page" th:href="@{/login}">ログアウト</a>
				</div>
				<div sec:authorize="isAnonymous()">
					<a class="nav-link" aria-current="page" th:href="@{/login}">ログイン</a>
				</div>
				<div sec:authorize="isAnonymous()">
					<a class="nav-link" aria-current="page" th:href="@{/userregister}">新規登録</a>
				</div>
			</div>
		</div>
	</div>
</nav>

</html>
