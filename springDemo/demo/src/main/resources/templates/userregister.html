<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <!--bootstrapの読み込み-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{share::header}"></div>
    <h2>ユーザー新規登録</h2>
    <form th:action="@{/register}" th:object="${userDto}" method="post">
        <div class="m-3">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}">usernameerror</p>
            <label for="bookTitle" class="form-label">ユーザー名</label>
            <input id="bookTitle" class="form-control" type="text" th:field="*{username}">
        </div>
        <div class="m-3">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">usernameerror</p>
            <label for="bookTitle" class="form-label">パスワード</label>
            <input id="bookTitle" class="form-control" type="password" th:field="*{password}">
        </div>

        <button type="submit">登録</button>
    </form>
</body>
