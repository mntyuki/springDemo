<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>ログイン</title>
	<!--bootstrapの読み込み-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div th:replace="~{share::header}"></div>

	<div class="container">
		<div class="mx-auto" style="width: 350px;">
			<h2>ログイン</h2>
			<form th:action="@{/login}" method="post">
				<div>
					<label>ユーザー名</label>
					<input class="form-control rounded-pill" type="text" name="username">
				</div>
				<div>
					<label>パスワード</label>
					<input class="form-control rounded-pill" type="password" name="password">
				</div>
				<button class="rounded-pill btn btn-primary text-nowrap" type="submit">ログイン</button>
			</form>
			<div th:if="${param.error}">
				ログインに失敗しました
			</div>
		</div>
	</div>
</body>
