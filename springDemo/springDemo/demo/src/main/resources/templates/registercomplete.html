<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>登録完了画面</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div th:replace="~{share::header}"></div>
	<h2>登録が完了しました</h2>
		<div>
			<p>ユーザー名: <span th:text="${username}"></span></p>
		</div>
		<div class=" mt-2">
			<p>パスワード: <span th:text="${password}"></span></p>
		</div>
		<a th:href="@{/login}">ログインする</a>
</body>

</html>
