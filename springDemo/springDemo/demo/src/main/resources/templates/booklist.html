<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
	<title>書籍一覧</title>

	<!--bootstrapの読み込み-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div th:replace="~{share::header}"></div>
	<div class="d-flex justify-content-center">
		<form th:action="@{/booklist}" class="d-flex" method="get">
			<input type="text" name="keyword" class="form-control rounded-pill me-2" placeholder="タイトル検索">
			<button type="submit" class="rounded-pill btn btn-primary text-nowrap">検索</button>
		</form>
	</div>
	<div class="container">
		<div class="row">
			<div th:each="book : ${bookList}" th:object="${book}" class="card col-2 me-2 mt-1" style="width: 16rem;">
				<div class="card-body">
					<!--<td th:text="*{id}"></td>-->
					<h5 class="card-title" th:text="*{title}"></h5>
					<p class="card-text" th:text="*{price}+' 円'"></p>
					<p class="card-text">発売日
						<span th:text="${book.publishDate}"></span>
					</p>
					<p class="card-text" th:text="'著者名 '+*{author}"></p>

					<button class="btn btn-warning mt-2" th:onclick="'addToCart(' + *{id} + ')'">
						カートに追加
					</button>

					<div sec:authorize="hasRole('ADMIN')">
						<a class="btn btn-success" th:href="@{/bookedit(id=*{id})}">編集</a>
						<form th:action="@{/bookdelete/{id}(id=${book.id})}" method="post">
							<button type="submit" class="btn btn-sm btn-danger">
								削除
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
		<div sec:authorize="hasRole('ADMIN')">
			<a class="btn btn-primary mt-3" th:href="@{/bookcreate}">書籍の登録</a>
		</div>
		<div class="d-flex justify-content-center mt-4">
			<div class="card shadow-lg p-4 text-center" style="width: 300px;">
				<p id="cartTotal">合計: 0円</p>
				<a th:href="@{/cart}" class="btn btn-outline-primary mt-3">
					カートの中身を見る
				</a>
			</div>
		</div>
	</div>
	<script th:src="@{/js/main.js}"></script>
</body>

</html>
